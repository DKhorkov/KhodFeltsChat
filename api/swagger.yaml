basePath: /
consumes:
    - application/json
definitions:
    Chat:
        properties:
            createdAt:
                description: Represents datetime when chat was created.
                format: date-time
                type: string
                x-go-name: CreatedAt
            description:
                description: Description of the chat.
                example: Long description of a party
                minLength: 1
                type: string
                x-go-name: Description
            id:
                description: Unique identifier of the chat.
                format: uint64
                minimum: 1
                type: integer
                x-go-name: ID
            isRead:
                description: Whether chat was read or not.
                example: true
                type: boolean
                x-go-name: IsRead
            members:
                description: Members of the chat.
                items:
                    $ref: '#/definitions/User'
                type: array
                x-go-name: Members
            messages:
                description: Messages which were sent to the chat.
                items:
                    $ref: '#/definitions/Message'
                type: array
                x-go-name: Messages
            title:
                description: Title of the chat.
                example: Party
                maxLength: 100
                minLength: 1
                type: string
                x-go-name: Title
            type:
                description: Type of the chat.
                enum:
                    - private
                    - group
                example: private
                maxLength: 40
                minLength: 1
                type: string
                x-go-name: Type
            updatedAt:
                description: Represents datetime when chat was updated.
                format: date-time
                type: string
                x-go-name: UpdatedAt
        required:
            - id
            - type
            - createdAt
            - updatedAt
            - isRead
        title: Chat represents a chat record, where users can send a message.
        type: object
        x-go-package: github.com/DKhorkov/kfc/internal/controllers/http/schemas
    CreateWebPushSubscriptionResponse:
        properties:
            id:
                description: ID of the created subscription
                format: uint64
                type: integer
                x-go-name: ID
        title: CreateWebPushSubscriptionResponse represents the response for a created push subscription.
        type: object
        x-go-package: github.com/DKhorkov/kfc/internal/controllers/http/schemas
    EmailInput:
        properties:
            email:
                description: Email of the user.
                example: alexqwerty@yandex.ru
                type: string
                x-go-name: Email
        required:
            - email
        type: object
        x-go-package: github.com/DKhorkov/kfc/internal/controllers/http/schemas
    MemberInput:
        properties:
            id:
                description: Unique identifier of the user.
                format: uint64
                minimum: 1
                type: integer
                x-go-name: ID
        required:
            - id
        title: MemberInput represents an input of members unique identifier for creating chat.
        type: object
        x-go-package: github.com/DKhorkov/kfc/internal/controllers/http/schemas
    Message:
        properties:
            chatId:
                description: Unique identifier of chat, in which message was sent.
                format: uint64
                minimum: 1
                type: integer
                x-go-name: ChatID
            createdAt:
                description: Represents datetime when message was sent.
                format: date-time
                type: string
                x-go-name: CreatedAt
            id:
                description: Unique identifier of the message.
                format: uint64
                minimum: 1
                type: integer
                x-go-name: ID
            isRead:
                description: Whether message was read or not for User.
                example: true
                type: boolean
                x-go-name: IsRead
            sender:
                $ref: '#/definitions/Sender'
            text:
                description: Text of the message.
                example: Anything
                minLength: 1
                type: string
                x-go-name: Text
            updatedAt:
                description: Represents datetime when message was updated.
                format: date-time
                type: string
                x-go-name: UpdatedAt
        required:
            - id
            - chatId
            - sender
            - text
            - createdAt
            - updatedAt
            - isRead
        title: Message represents a message record, which was sent to the chat.
        type: object
        x-go-package: github.com/DKhorkov/kfc/internal/controllers/http/schemas
    NewPasswordInput:
        properties:
            newPassword:
                description: New password of the user.
                example: SomePa$$wordWithDifferentRegisterAndNubmersAndSpecialCharacters228
                type: string
                x-go-name: NewPassword
        required:
            - newPassword
        type: object
        x-go-package: github.com/DKhorkov/kfc/internal/controllers/http/schemas
    Sender:
        properties:
            id:
                description: Unique identifier of the user.
                format: uint64
                minimum: 1
                type: integer
                x-go-name: ID
            username:
                description: Unique username of the user.
                example: D3M0S
                maxLength: 70
                minLength: 5
                type: string
                x-go-name: Username
        required:
            - id
            - username
        title: Sender represents a user record, who sent message to the chat.
        type: object
        x-go-package: github.com/DKhorkov/kfc/internal/controllers/http/schemas
    Settings:
        properties:
            emailConsents:
                description: Email notification consents bitmask.
                format: int64
                type: integer
                x-go-name: EmailConsents
            theme:
                description: Theme of the user interface. 0 = Light, 1 = Dark.
                format: int64
                maximum: 1
                minimum: 0
                type: integer
                x-go-name: Theme
            webPushConsents:
                description: Web push notification consents bitmask.
                format: int64
                type: integer
                x-go-name: WebPushConsents
        required:
            - theme
            - emailConsents
            - webPushConsents
        title: Settings represents user settings.
        type: object
        x-go-package: github.com/DKhorkov/kfc/internal/controllers/http/schemas
    User:
        properties:
            createdAt:
                description: Represents datetime when user was registered.
                format: date-time
                type: string
                x-go-name: CreatedAt
            email:
                description: Email of the user.
                example: alexqwerty@yandex.ru
                type: string
                x-go-name: Email
            emailConfirmed:
                description: Represents whether email of the user confirmed or not.
                type: boolean
                x-go-name: EmailConfirmed
            id:
                description: Unique identifier of the user.
                format: uint64
                minimum: 1
                type: integer
                x-go-name: ID
            updatedAt:
                description: Represents datetime when user was updated.
                format: date-time
                type: string
                x-go-name: UpdatedAt
            username:
                description: Unique username of the user.
                example: D3M0S
                maxLength: 70
                minLength: 5
                type: string
                x-go-name: Username
        required:
            - id
            - username
            - email
            - emailConfirmed
            - createdAt
            - updatedAt
        title: User represents a user's contact record.
        type: object
        x-go-package: github.com/DKhorkov/kfc/internal/controllers/http/schemas
    VAPIDKeyResponse:
        properties:
            publicKey:
                description: VAPID public key
                type: string
                x-go-name: PublicKey
        title: VAPIDKeyResponse represents the VAPID public key response.
        type: object
        x-go-package: github.com/DKhorkov/kfc/internal/controllers/http/schemas
info:
    description: Documentation for REST API of KFC
    title: Khod Felts Chat API
    version: 1.0.0
paths:
    /:
        get:
            description: Serves the home page.
            operationId: HomePage
            responses:
                "200":
                    $ref: '#/responses/OK'
                "500":
                    $ref: '#/responses/InternalServerError'
            summary: HomePage
            tags:
                - web
    /api/chats:
        get:
            description: Provides list of chats for current user with pagination.
            operationId: GetUserChats
            parameters:
                - description: Maximum amount of entries
                  format: int64
                  in: query
                  name: limit
                  type: integer
                  x-go-name: Limit
                - description: Number of entries to skip from the beginning of the result set before starting to return the desired entries
                  format: int64
                  in: query
                  name: offset
                  type: integer
                  x-go-name: Offset
            responses:
                "200":
                    description: Chat
                    schema:
                        items:
                            $ref: '#/definitions/Chat'
                        type: array
                "401":
                    $ref: '#/responses/Unauthorized'
                "404":
                    $ref: '#/responses/NotFound'
                "500":
                    $ref: '#/responses/InternalServerError'
            security:
                - cookieAuth:
                    - '[]'
            summary: GetUserChats
            tags:
                - chats
        post:
            description: CreateChat creates new chat with provided info.
            operationId: CreateChat
            parameters:
                - description: Information about Chat for creation
                  in: body
                  name: Body
                  required: true
                  schema:
                    properties:
                        members:
                            description: Members of the chat. Current User should NOT be provided directly!
                            items:
                                $ref: '#/definitions/MemberInput'
                            type: array
                            x-go-name: Members
                        type:
                            description: Type of the chat.
                            enum:
                                - private
                                - group
                            example: private
                            maxLength: 40
                            minLength: 1
                            type: string
                            x-go-name: Type
                    required:
                        - type
                        - members
                    type: object
            responses:
                "201":
                    description: Chat
                    schema:
                        $ref: '#/definitions/Chat'
                "400":
                    $ref: '#/responses/BadRequest'
                "401":
                    $ref: '#/responses/Unauthorized'
                "500":
                    $ref: '#/responses/InternalServerError'
            security:
                - cookieAuth:
                    - '[]'
            summary: CreateChat
            tags:
                - chats
    /api/chats/{id}/messages:
        get:
            description: Provides list of messages, which were sent to the chat with specified id, with pagination.
            operationId: GetChatMessages
            parameters:
                - description: Maximum amount of entries
                  format: int64
                  in: query
                  name: limit
                  type: integer
                  x-go-name: Limit
                - description: Number of entries to skip from the beginning of the result set before starting to return the desired entries
                  format: int64
                  in: query
                  name: offset
                  type: integer
                  x-go-name: Offset
            responses:
                "200":
                    description: Message
                    schema:
                        items:
                            $ref: '#/definitions/Message'
                        type: array
                "400":
                    $ref: '#/responses/BadRequest'
                "401":
                    $ref: '#/responses/Unauthorized'
                "403":
                    $ref: '#/responses/Forbidden'
                "404":
                    $ref: '#/responses/NotFound'
                "500":
                    $ref: '#/responses/InternalServerError'
            security:
                - cookieAuth:
                    - '[]'
            summary: GetChatMessages
            tags:
                - chats
    /api/sessions:
        delete:
            description: Logout User from the current session and deletes access and refresh tokens.
            operationId: Logout
            responses:
                "204":
                    $ref: '#/responses/NoContent'
                "401":
                    $ref: '#/responses/Unauthorized'
                "500":
                    $ref: '#/responses/InternalServerError'
            summary: Logout
            tags:
                - sessions
        post:
            description: Logins User and provides access and refresh tokens.
            operationId: Login
            parameters:
                - description: Information about User for login
                  in: body
                  name: Body
                  required: true
                  schema:
                    properties:
                        login:
                            description: Email or Username of the user.
                            example: alexqwerty@yandex.ru
                            type: string
                            x-go-name: Login
                        password:
                            description: Password of the user.
                            example: SomePa$$wordWithDifferentRegisterAndNubmersAndSpecialCharacters228
                            type: string
                            x-go-name: Password
                    required:
                        - password
                        - login
                    type: object
            responses:
                "204":
                    $ref: '#/responses/NoContent'
                "400":
                    $ref: '#/responses/BadRequest'
                "401":
                    $ref: '#/responses/Unauthorized'
                "403":
                    $ref: '#/responses/Forbidden'
                "404":
                    $ref: '#/responses/NotFound'
                "500":
                    $ref: '#/responses/InternalServerError'
            summary: Login
            tags:
                - sessions
        put:
            description: Refreshes accessToken and refreshToken of current user.
            operationId: RefreshTokens
            parameters:
                - description: Refresh token to refresh accessToken and refreshToken of user. SHOULD BE PROVIDED IN COOKIE.
                  format: byte
                  in: header
                  name: refreshToken
                  required: true
                  type: string
                  x-go-name: RefreshToken
            responses:
                "204":
                    $ref: '#/responses/NoContent'
                "401":
                    $ref: '#/responses/Unauthorized'
                "500":
                    $ref: '#/responses/InternalServerError'
            summary: RefreshTokens
            tags:
                - sessions
    /api/sessions/all:
        delete:
            description: Logout User from all sessions and deletes access and refresh tokens.
            operationId: LogoutAll
            responses:
                "204":
                    $ref: '#/responses/NoContent'
                "401":
                    $ref: '#/responses/Unauthorized'
                "500":
                    $ref: '#/responses/InternalServerError'
            security:
                - cookieAuth:
                    - '[]'
            summary: LogoutAll
            tags:
                - sessions
    /api/users:
        get:
            description: Provides list of Users.
            operationId: GetUsers
            parameters:
                - description: Maximum amount of entries
                  format: int64
                  in: query
                  name: limit
                  type: integer
                  x-go-name: Limit
                - description: Number of entries to skip from the beginning of the result set before starting to return the desired entries
                  format: int64
                  in: query
                  name: offset
                  type: integer
                  x-go-name: Offset
                - description: Username or it's part to search users that matches it
                  in: query
                  name: username
                  type: string
                  x-go-name: Username
            responses:
                "200":
                    description: User
                    schema:
                        items:
                            $ref: '#/definitions/User'
                        type: array
                "500":
                    $ref: '#/responses/InternalServerError'
            summary: GetUsers
            tags:
                - users
        post:
            description: Registers new User with provided info.
            operationId: RegisterUser
            parameters:
                - description: Information about User for registration
                  in: body
                  name: Body
                  required: true
                  schema:
                    properties:
                        email:
                            description: Email of the user.
                            example: alexqwerty@yandex.ru
                            type: string
                            x-go-name: Email
                        password:
                            description: Password of the user.
                            example: SomePa$$wordWithDifferentRegisterAndNubmersAndSpecialCharacters228
                            type: string
                            x-go-name: Password
                        username:
                            description: Unique username of the user.
                            example: D3M0S
                            maxLength: 70
                            minLength: 5
                            type: string
                            x-go-name: Username
                    required:
                        - email
                        - username
                        - password
                    type: object
            responses:
                "201":
                    description: User
                    schema:
                        $ref: '#/definitions/User'
                "400":
                    $ref: '#/responses/BadRequest'
                "409":
                    $ref: '#/responses/Conflict'
                "500":
                    $ref: '#/responses/InternalServerError'
            summary: RegisterUser
            tags:
                - users
    /api/users/{id}:
        get:
            description: Provides User with specified ID.
            operationId: GetUserByID
            parameters:
                - description: Unique identifier
                  format: int64
                  in: path
                  name: id
                  required: true
                  type: integer
                  x-go-name: ID
            responses:
                "200":
                    description: User
                    schema:
                        $ref: '#/definitions/User'
                "400":
                    $ref: '#/responses/BadRequest'
                "404":
                    $ref: '#/responses/NotFound'
                "500":
                    $ref: '#/responses/InternalServerError'
            summary: GetUserByID
            tags:
                - users
    /api/users/email/verify:
        post:
            description: Sends message with information how to verify email.
            operationId: SendVerifyEmailMessage
            parameters:
                - description: Information for sending message to User
                  in: body
                  name: Body
                  required: true
                  schema:
                    $ref: '#/definitions/EmailInput'
            responses:
                "204":
                    $ref: '#/responses/NoContent'
                "400":
                    $ref: '#/responses/BadRequest'
                "404":
                    $ref: '#/responses/NotFound'
                "409":
                    $ref: '#/responses/Conflict'
                "500":
                    $ref: '#/responses/InternalServerError'
            summary: SendVerifyEmailMessage
            tags:
                - users
    /api/users/email/verify/{verifyEmailToken}:
        get:
            description: Verifies email for user with provided verifyEmailToken.
            operationId: VerifyEmail
            parameters:
                - description: Token to define user for email verification
                  format: byte
                  in: path
                  name: verifyEmailToken
                  required: true
                  type: string
                  x-go-name: VerifyEmailToken
            responses:
                "204":
                    $ref: '#/responses/NoContent'
                "401":
                    $ref: '#/responses/Unauthorized'
                "404":
                    $ref: '#/responses/NotFound'
                "409":
                    $ref: '#/responses/Conflict'
                "500":
                    $ref: '#/responses/InternalServerError'
            summary: VerifyEmail
            tags:
                - users
    /api/users/me:
        get:
            description: Provides current authorized User.
            operationId: GetCurrentUser
            responses:
                "200":
                    description: User
                    schema:
                        $ref: '#/definitions/User'
                "401":
                    $ref: '#/responses/Unauthorized'
                "404":
                    $ref: '#/responses/NotFound'
                "500":
                    $ref: '#/responses/InternalServerError'
            security:
                - cookieAuth:
                    - '[]'
            summary: GetCurrentUser
            tags:
                - users
        put:
            description: Updates information about User with specified ID.
            operationId: UpdateCurrentUser
            parameters:
                - description: Information about current User for update
                  in: body
                  name: Body
                  required: true
                  schema:
                    properties:
                        username:
                            description: Unique username of the user.
                            example: D3M0S
                            maxLength: 70
                            minLength: 5
                            type: string
                            x-go-name: Username
                    required:
                        - username
                    type: object
            responses:
                "200":
                    description: User
                    schema:
                        $ref: '#/definitions/User'
                "400":
                    $ref: '#/responses/BadRequest'
                "401":
                    $ref: '#/responses/Unauthorized'
                "404":
                    $ref: '#/responses/NotFound'
                "500":
                    $ref: '#/responses/InternalServerError'
            security:
                - cookieAuth:
                    - '[]'
            summary: UpdateCurrentUser
            tags:
                - users
    /api/users/me/settings:
        get:
            description: Provides settings of the current authorized User.
            operationId: GetSettings
            responses:
                "200":
                    description: Settings
                    schema:
                        $ref: '#/definitions/Settings'
                "401":
                    $ref: '#/responses/Unauthorized'
                "404":
                    $ref: '#/responses/NotFound'
                "500":
                    $ref: '#/responses/InternalServerError'
            security:
                - cookieAuth:
                    - '[]'
            summary: GetSettings
            tags:
                - users
        put:
            description: Updates settings of the current authorized User.
            operationId: UpdateSettings
            parameters:
                - description: Settings data to update
                  in: body
                  name: Body
                  required: true
                  schema:
                    $ref: '#/definitions/Settings'
            responses:
                "200":
                    description: Settings
                    schema:
                        $ref: '#/definitions/Settings'
                "400":
                    $ref: '#/responses/BadRequest'
                "401":
                    $ref: '#/responses/Unauthorized'
                "404":
                    $ref: '#/responses/NotFound'
                "500":
                    $ref: '#/responses/InternalServerError'
            security:
                - cookieAuth:
                    - '[]'
            summary: UpdateSettings
            tags:
                - users
    /api/users/password/change:
        post:
            description: Changes old password to new password of current user.
            operationId: ChangePassword
            parameters:
                - description: Information about User to change password
                  in: body
                  name: Body
                  required: true
                  schema:
                    properties:
                        newPassword:
                            description: New password of the user.
                            example: SomePa$$wordWithDifferentRegisterAndNubmersAndSpecialCharacters228
                            type: string
                            x-go-name: NewPassword
                        oldPassword:
                            description: Old password of the user.
                            example: SomeOldPa$$wordWithDifferentRegisterAndNubmersAndSpecialCharacters228
                            type: string
                            x-go-name: OldPassword
                    required:
                        - newPassword
                        - oldPassword
                    type: object
            responses:
                "204":
                    $ref: '#/responses/NoContent'
                "400":
                    $ref: '#/responses/BadRequest'
                "401":
                    $ref: '#/responses/Unauthorized'
                "404":
                    $ref: '#/responses/NotFound'
                "500":
                    $ref: '#/responses/InternalServerError'
            security:
                - cookieAuth:
                    - '[]'
            summary: ChangePassword
            tags:
                - users
    /api/users/password/forget:
        post:
            description: Sends message with information how to forget old password.
            operationId: SendForgetPasswordMessage
            parameters:
                - description: Information for sending message to User
                  in: body
                  name: Body
                  required: true
                  schema:
                    $ref: '#/definitions/EmailInput'
            responses:
                "204":
                    $ref: '#/responses/NoContent'
                "400":
                    $ref: '#/responses/BadRequest'
                "403":
                    $ref: '#/responses/Forbidden'
                "404":
                    $ref: '#/responses/NotFound'
                "500":
                    $ref: '#/responses/InternalServerError'
            summary: SendForgetPasswordMessage
            tags:
                - users
    /api/users/password/forget/{forgetPasswordToken}:
        post:
            description: Changes forgotten password to new password for user with provided forgetPasswordToken.
            operationId: ForgetPassword
            parameters:
                - description: Information about User to forget old password
                  in: body
                  name: Body
                  required: true
                  schema:
                    $ref: '#/definitions/NewPasswordInput'
                - description: Token to define user for forgetting old password
                  format: byte
                  in: path
                  name: forgetPasswordToken
                  required: true
                  type: string
                  x-go-name: ForgetPasswordToken
            responses:
                "204":
                    $ref: '#/responses/NoContent'
                "400":
                    $ref: '#/responses/BadRequest'
                "401":
                    $ref: '#/responses/Unauthorized'
                "404":
                    $ref: '#/responses/NotFound'
                "500":
                    $ref: '#/responses/InternalServerError'
            summary: ForgetPassword
            tags:
                - users
    /api/web-push/subscribe:
        post:
            description: Creates a new web-push subscription for the current authorized User.
            operationId: CreateWebPushSubscription
            parameters:
                - description: WebPush subscription data
                  in: body
                  name: Body
                  required: true
                  schema:
                    properties:
                        auth:
                            description: Auth secret
                            type: string
                            x-go-name: Auth
                        encryptionKey:
                            description: Encryption key (P-256 ECDH)
                            type: string
                            x-go-name: EncryptionKey
                        endpoint:
                            description: WebPush endpoint URL
                            type: string
                            x-go-name: Endpoint
                    required:
                        - endpoint
                        - encryptionKey
                        - auth
                    type: object
            responses:
                "201":
                    description: CreateWebPushSubscriptionResponse
                    schema:
                        $ref: '#/definitions/CreateWebPushSubscriptionResponse'
                "400":
                    $ref: '#/responses/BadRequest'
                "401":
                    $ref: '#/responses/Unauthorized'
                "500":
                    $ref: '#/responses/InternalServerError'
            security:
                - cookieAuth:
                    - '[]'
            summary: CreateWebPushSubscription
            tags:
                - web-pushes
    /api/web-push/subscriptions/{id}:
        delete:
            description: Deletes a web-push subscription by ID for the current authorized User.
            operationId: DeleteWebPushSubscription
            responses:
                "204":
                    description: ""
                "400":
                    $ref: '#/responses/BadRequest'
                "401":
                    $ref: '#/responses/Unauthorized'
                "500":
                    $ref: '#/responses/InternalServerError'
            security:
                - cookieAuth:
                    - '[]'
            summary: DeleteWebPushSubscription
            tags:
                - web-pushes
    /api/web-push/vapid-key:
        get:
            description: Returns the VAPID public key for web-push subscription registration.
            operationId: GetVAPIDKey
            responses:
                "200":
                    description: VAPIDKeyResponse
                    schema:
                        $ref: '#/definitions/VAPIDKeyResponse'
                "500":
                    $ref: '#/responses/InternalServerError'
            summary: GetVAPIDKey
            tags:
                - web-pushes
    /api/ws:
        get:
            description: Creates websocket connection for current user.
            operationId: CreateWebsocket
            responses:
                "101":
                    $ref: '#/responses/SwitchingProtocols'
                "401":
                    $ref: '#/responses/Unauthorized'
                "404":
                    $ref: '#/responses/NotFound'
                "500":
                    $ref: '#/responses/InternalServerError'
            security:
                - cookieAuth:
                    - '[]'
            summary: CreateWebsocket
            tags:
                - websockets
    /web/chat:
        get:
            description: Serves the chat page.
