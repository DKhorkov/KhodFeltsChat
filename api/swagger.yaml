produces:
    - application/json
responses:
    BadRequest:
        description: BadRequest message returned when request was incorrect
        headers:
            StatusCode:
                description: |-
                    HTTP Status Code
                    in: header
                format: int64
                type: integer
    Conflict:
        description: Conflict message returned when entity already exists or operation already done
        headers:
            StatusCode:
                description: |-
                    HTTP Status Code
                    in: header
                format: int64
                type: integer
    Forbidden:
        description: Forbidden message returned when user has no rights
        headers:
            StatusCode:
                description: |-
                    HTTP Status Code
                    in: header
                format: int64
                type: integer
    InternalServerError:
        description: InternalServerError message returned when something not-normal happened during processing request
        headers:
            StatusCode:
                description: |-
                    HTTP Status Code
                    in: header
                format: int64
                type: integer
    NoContent:
        description: NoContent message returned when there is no payload in Response Body
        headers:
            StatusCode:
                description: |-
                    HTTP Status Code
                    in: header
                format: int64
                type: integer
    NotFound:
        description: NotFound message returned as when requested entity not found
        headers:
            StatusCode:
                description: |-
                    HTTP Status Code
                    in: header
                format: int64
                type: integer
    OK:
        description: OK message returned when request was successfully processed
        headers:
            StatusCode:
                description: |-
                    HTTP Status Code
                    in: header
                format: int64
                type: integer
    SeeOther:
        description: SeeOther message returned when redirect to another URL was made
        headers:
            StatusCode:
                description: |-
                    HTTP Status Code
                    in: header
                format: int64
                type: integer
    SwitchingProtocols:
        description: SwitchingProtocols message returned when HTTP connection was upgraded to WebSocket
        headers:
            StatusCode:
                description: |-
                    HTTP Status Code
                    in: header
                format: int64
                type: integer
    Unauthorized:
        description: Unauthorized message returned when no information about current User
        headers:
            StatusCode:
                description: |-
                    HTTP Status Code
                    in: header
                format: int64
                type: integer
