<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/web/static/assets/icon.png">
    <link rel="apple-touch-icon" href="/web/static/assets/icon.png">
    <link rel="manifest" href="/web/static/manifest.json">
    <title>KFC Chat</title>
    <script>if(localStorage.getItem('theme')==='dark')document.documentElement.setAttribute('data-bs-theme','dark');</script>
    <link rel="stylesheet" href="/web/static/css/global.css">
    <link rel="stylesheet" href="/web/static/css/navbar.css">
    <link rel="stylesheet" href="/web/static/css/alert-modal.css">
    <link rel="stylesheet" href="/web/static/css/home.css">
    <script src="/web/static/js/auth.js" defer></script>
    <script src="/web/static/js/alert-modal.js" defer></script>
    <script src="/web/static/js/validation.js" defer></script>
    <script src="/web/static/js/errors-mapper.js" defer></script>
    <script src="/web/static/js/navbar.js" defer></script>
</head>
<body>
    {{template "navbar"}}

    <main class="hero">
        <div class="hero__content">
            <h1 class="hero__title">KFC Chat</h1>
            <p class="hero__subtitle">
                Безопасный мессенджер с поддержкой приватных и групповых чатов.
                Общайтесь в реальном времени через веб-интерфейс или установите десктоп-клиент.
            </p>
            <div class="hero__actions">
                <a href="/web/chat" class="hero__btn hero__btn--primary">Начать общение</a>
                <a href="https://github.com/DKhorkov/KhodFeltsChatGUI/releases" target="_blank"
                   rel="noopener noreferrer" class="hero__btn hero__btn--secondary">Скачать клиент</a>
            </div>
        </div>
    </main>
</body>
</html>
