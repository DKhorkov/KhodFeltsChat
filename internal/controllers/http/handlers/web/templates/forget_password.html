<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KFC Chat — Сброс пароля</title>
    <link rel="stylesheet" href="/web/static/css/global.css">
    <link rel="stylesheet" href="/web/static/css/navbar.css">
    <link rel="stylesheet" href="/web/static/css/alert-modal.css">
    <link rel="stylesheet" href="/web/static/css/forget-password.css">
    <script src="/web/static/js/navbar.js" defer></script>
    <script src="/web/static/js/alert-modal.js" defer></script>
    <script src="/web/static/js/validation.js" defer></script>
    <script src="/web/static/js/errors-mapper.js" defer></script>
    <script src="/web/static/js/forget-password.js" defer></script>
</head>
<body>
    {{template "navbar"}}

    <div class="forget-password-container">
        <div class="forget-password-card">
            <h2 class="forget-password-card__title">Сброс пароля</h2>

            {{if .Email}}
            <p class="forget-password-card__info">
                Письмо с кодом для сброса пароля отправлено на <strong>{{.Email}}</strong>.
                Введите полученный код и новый пароль.
            </p>
            {{end}}

            <form id="forget-password-form" class="forget-password-card__form">
                <div>
                    <label>Код из письма</label>
                    <input
                        type="text"
                        name="token"
                        placeholder="Введите код из письма"
                        required
                    >
                </div>

                <div>
                    <label>Новый пароль</label>
                    <input
                        type="password"
                        name="newPassword"
                        placeholder="Новый пароль"
                        required
                    >
                </div>

                <div>
                    <label>Подтверждение пароля</label>
                    <input
                        type="password"
                        name="confirmPassword"
                        placeholder="Подтвердите пароль"
                        required
                    >
                </div>

                <div class="forget-password-card__actions">
                    <a href="/web/login" class="btn--secondary">Назад</a>
                    <button type="submit" class="btn--primary">Сбросить пароль</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
