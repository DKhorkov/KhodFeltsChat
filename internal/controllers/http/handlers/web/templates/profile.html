<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KFC Chat — Профиль</title>
    <link rel="stylesheet" href="/web/static/css/global.css">
    <link rel="stylesheet" href="/web/static/css/navbar.css">
    <link rel="stylesheet" href="/web/static/css/alert-modal.css">
    <link rel="stylesheet" href="/web/static/css/profile.css">
    <script src="/web/static/js/auth.js" defer></script>
    <script src="/web/static/js/navbar.js" defer></script>
    <script src="/web/static/js/alert-modal.js" defer></script>
    <script src="/web/static/js/validation.js" defer></script>
    <script src="/web/static/js/errors-mapper.js" defer></script>
    <script src="/web/static/js/profile.js" defer></script>
</head>
<body>
    {{template "navbar"}}

    <div class="profile-container">
        <div class="profile-card">
            <div class="profile-card__header">
                <div class="profile-card__avatar" id="profile-avatar"></div>
                <div class="profile-card__title">
                    <h2 id="profile-username"></h2>
                    <span class="profile-card__email" id="profile-email"></span>
                </div>
            </div>

            <div class="profile-card__details">
                <div class="profile-card__row">
                    <span class="profile-card__label">Email подтверждён</span>
                    <span class="profile-card__value" id="profile-email-confirmed"></span>
                </div>
                <div class="profile-card__row">
                    <span class="profile-card__label">Дата регистрации</span>
                    <span class="profile-card__value" id="profile-created-at"></span>
                </div>
            </div>

            <div class="profile-card__section">
                <div class="profile-card__toggle" id="toggle-edit-profile">
                    <span class="profile-card__label">Редактировать профиль</span>
                    <span class="profile-card__chevron">&#9654;</span>
                </div>
                <form id="edit-profile-form" class="profile-card__form" style="display: none;">
                    <div class="profile-card__form-group">
                        <label>Логин</label>
                        <input type="text" name="username" placeholder="Введите новый логин">
                    </div>
                    <div class="profile-card__form-actions">
                        <button type="submit" class="btn--primary">Сохранить</button>
                    </div>
                </form>
            </div>

            <div class="profile-card__section">
                <div class="profile-card__toggle" id="toggle-change-password">
                    <span class="profile-card__label">Сменить пароль</span>
                    <span class="profile-card__chevron">&#9654;</span>
                </div>
                <form id="change-password-form" class="profile-card__form" style="display: none;">
                    <div class="profile-card__form-group">
                        <label>Старый пароль</label>
                        <input type="password" name="oldPassword" placeholder="Введите старый пароль">
                    </div>
                    <div class="profile-card__form-group">
                        <label>Новый пароль</label>
                        <input type="password" name="newPassword" placeholder="Введите новый пароль">
                    </div>
                    <div class="profile-card__form-group">
                        <label>Подтверждение пароля</label>
                        <input type="password" name="confirmPassword" placeholder="Подтвердите новый пароль">
                    </div>
                    <div class="profile-card__form-actions">
                        <button type="submit" class="btn--primary">Сменить пароль</button>
                    </div>
                </form>
            </div>

            <div class="profile-card__actions">
                <button id="btn-logout" class="btn--danger">Выйти из аккаунта</button>
            </div>
        </div>
    </div>
</body>
</html>
