<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/web/static/assets/icon.png">
    <link rel="apple-touch-icon" href="/web/static/assets/icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="manifest" href="/web/static/manifest.json">
    <title>KFC Chat — Вход</title>
    <script>if(localStorage.getItem('theme')==='dark')document.documentElement.setAttribute('data-bs-theme','dark');</script>
    <link rel="stylesheet" href="/web/static/css/global.css">
    <link rel="stylesheet" href="/web/static/css/navbar.css">
    <link rel="stylesheet" href="/web/static/css/alert-modal.css">
    <link rel="stylesheet" href="/web/static/css/login.css">
    <script src="/web/static/js/auth.js" defer></script>
    <script src="/web/static/js/alert-modal.js" defer></script>
    <script src="/web/static/js/validation.js" defer></script>
    <script src="/web/static/js/errors-mapper.js" defer></script>
    <script src="/web/static/js/navbar.js" defer></script>
    <script src="/web/static/js/login.js" defer></script>
</head>
<body>
    {{template "navbar"}}

    <div class="login-container">
        <div class="login-card">
            <div class="login-card__tabs">
                <button class="login-card__tab login-card__tab--active" data-tab="login">Вход</button>
                <button class="login-card__tab" data-tab="register">Регистрация</button>
            </div>

            <div id="tab-login" class="login-card__tab-content">
                <form id="login-form" class="login-form">
                    <input
                        class="login-form__input"
                        type="text"
                        name="login"
                        placeholder="Почта или имя пользователя"
                        aria-label="Почта или имя пользователя"
                        required
                    >
                    <input
                        class="login-form__input"
                        type="password"
                        name="password"
                        placeholder="Пароль"
                        aria-label="Пароль"
                        required
                    >
                    <button type="submit" class="login-form__submit">Войти</button>
                </form>

                <div class="login-form__links">
                    <button id="btn-verify-email" class="login-form__link" type="button">
                        Отправить повторно письмо для подтверждения почты
                    </button>
                    <button id="btn-forget-password" class="login-form__link login-form__link--danger" type="button">
                        Сбросить пароль
                    </button>
                </div>
            </div>

            <div id="tab-register" class="login-card__tab-content" style="display: none;">
                <form id="register-form" class="login-form">
                    <input
                        class="login-form__input"
                        type="email"
                        name="email"
                        placeholder="Почта"
                        aria-label="Почта"
                        required
                    >
                    <input
                        class="login-form__input"
                        type="text"
                        name="username"
                        placeholder="Логин"
                        aria-label="Логин"
                        required
                    >
                    <input
                        class="login-form__input"
                        type="password"
                        name="password"
                        placeholder="Пароль"
                        aria-label="Пароль"
                        required
                    >
                    <input
                        class="login-form__input"
                        type="password"
                        name="confirmPassword"
                        placeholder="Подтверждение пароля"
                        aria-label="Подтверждение пароля"
                        required
                    >
                    <button type="submit" class="login-form__submit">Зарегистрироваться</button>
                </form>
            </div>
        </div>
    </div>

</body>
</html>
