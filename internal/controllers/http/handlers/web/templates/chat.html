<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
    <link rel="icon" type="image/png" href="/web/static/assets/icon.png">
    <link rel="apple-touch-icon" href="/web/static/assets/icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="manifest" href="/web/static/manifest.json">
    <title>KFC Chat — Чаты</title>
    <script>if(localStorage.getItem('theme')==='dark')document.documentElement.setAttribute('data-bs-theme','dark');</script>
    <link rel="stylesheet" href="/web/static/css/global.css">
    <link rel="stylesheet" href="/web/static/css/navbar.css">
    <link rel="stylesheet" href="/web/static/css/alert-modal.css">
    <link rel="stylesheet" href="/web/static/css/chat.css">
    <link rel="stylesheet" href="/web/static/css/emoji-picker.css">
    <script src="/web/static/js/auth.js" defer></script>
    <script src="/web/static/js/alert-modal.js" defer></script>
    <script src="/web/static/js/validation.js" defer></script>
    <script src="/web/static/js/errors-mapper.js" defer></script>
    <script src="/web/static/js/navbar.js" defer></script>
    <script src="/web/static/js/emoji-picker.js" defer></script>
    <script src="/web/static/js/chat.js" defer></script>
</head>
<body>
    {{template "navbar"}}

    <div class="chat-layout">
        <aside class="sidebar" aria-label="Список чатов">
            <div class="sidebar__header">
                <h3>Чаты</h3>
                <button class="sidebar__icon-btn" id="btn-create-chat" title="Создать чат" aria-label="Создать чат">+</button>
                <button class="sidebar__icon-btn" id="btn-search-users" title="Поиск пользователей" aria-label="Найти пользователей">&#x1F50D;</button>
            </div>
            <div class="sidebar__list" id="chat-list"></div>
        </aside>

        <main class="conversation" id="conversation" style="display: none;">
            <div class="conversation__header">
                <h3 class="conversation__header-title" id="conversation-title"></h3>
                <button class="conversation__close-btn" id="btn-close-chat" title="Закрыть чат" aria-label="Закрыть чат">&times;</button>
            </div>

            <div class="conversation__messages" id="messages-list"></div>

            <div class="conversation__composer">
                <div class="conversation__reply-bar" id="reply-bar" style="display: none;">
                    <div class="conversation__reply-bar-content">
                        <span class="conversation__reply-bar-sender" id="reply-bar-sender"></span>
                        <span class="conversation__reply-bar-text" id="reply-bar-text"></span>
                    </div>
                    <button class="conversation__reply-bar-close" id="btn-cancel-reply" aria-label="Отменить ответ">&times;</button>
                </div>
                <div class="conversation__composer-input">
                    <textarea
                        id="message-input"
                        placeholder="Введите сообщение..."
                        rows="3"
                        aria-label="Сообщение"
                    ></textarea>
                    <div class="conversation__emoji-wrapper">
                        <button type="button" class="conversation__emoji-toggle" id="btn-emoji-toggle" title="Смайлы" aria-label="Эмодзи">
                            &#x1F642;
                        </button>
                        <div class="emoji-picker" id="emoji-picker-container" style="display: none;"></div>
                    </div>
                </div>
                <button id="btn-send" disabled aria-label="Отправить">Отправить</button>
            </div>
        </main>

        <div class="conversation__placeholder" id="conversation-placeholder">
            <p>Выберите чат для начала общения</p>
        </div>
    </div>

    <!-- Модалка создания чата -->
    <div class="modal-overlay" id="modal-create-chat" style="display: none;" role="dialog" aria-modal="true">
        <div class="modal-content" id="modal-create-chat-content">
            <button class="modal-content__close" id="btn-close-create-chat" aria-label="Закрыть">&times;</button>
            <h2 class="modal-content__title">Создать чат</h2>

            <div class="modal-content__form-group">
                <label for="create-chat-type">Тип чата</label>
                <select id="create-chat-type">
                    <option value="private">Приватный</option>
                    <option value="group">Групповой</option>
                </select>
            </div>

            <div class="modal-content__form-group" id="group-title-field" style="display: none;">
                <label for="create-chat-title">Название чата</label>
                <input id="create-chat-title" placeholder="Название чата">
            </div>

            <div class="modal-content__form-group" id="group-description-field" style="display: none;">
                <label for="create-chat-description">Описание чата</label>
                <input id="create-chat-description" placeholder="Описание чата">
            </div>

            <div class="modal-content__form-group">
                <label for="create-chat-search">Поиск пользователей</label>
                <input id="create-chat-search" placeholder="Введите имя пользователя...">
            </div>

            <div class="modal-content__users-list" id="create-chat-users" style="display: none;"></div>

            <div class="modal-content__actions">
                <button class="btn--primary" id="btn-do-create-chat">Создать</button>
            </div>
        </div>
    </div>

    <!-- Модалка поиска пользователей -->
    <div class="modal-overlay" id="modal-search-users" style="display: none;" role="dialog" aria-modal="true">
        <div class="modal-content" id="modal-search-users-content">
            <button class="modal-content__close" id="btn-close-search-users" aria-label="Закрыть">&times;</button>
            <h2 class="modal-content__title">Поиск пользователей</h2>

            <div class="modal-content__form-group">
                <label for="search-users-input" class="visually-hidden">Поиск пользователей</label>
                <input id="search-users-input" placeholder="Введите имя пользователя...">
            </div>

            <div class="modal-content__users-list" id="search-users-list" style="display: none;"></div>
            <div class="modal-content__no-results" id="search-users-empty" style="display: none;">
                Пользователи не найдены
            </div>
        </div>
    </div>

    <!-- Модалка профиля участника -->
    <div class="modal-overlay" id="modal-member-profile" style="display: none;" role="dialog" aria-modal="true">
        <div class="modal-content profile-modal" id="modal-member-profile-content">
            <button class="modal-content__close" id="btn-close-member-profile" aria-label="Закрыть">&times;</button>
            <div class="profile-modal__header">
                <div class="profile-modal__avatar" id="member-avatar"></div>
                <div class="profile-modal__title">
                    <h2 id="member-username"></h2>
                    <span class="profile-modal__email" id="member-email"></span>
                </div>
            </div>
            <div class="profile-modal__details">
                <div class="profile-modal__row">
                    <span class="profile-modal__label">Email подтверждён</span>
                    <span class="profile-modal__value" id="member-email-confirmed"></span>
                </div>
                <div class="profile-modal__row">
                    <span class="profile-modal__label">Дата регистрации</span>
                    <span class="profile-modal__value" id="member-created-at"></span>
                </div>
            </div>
        </div>
    </div>

    <!-- Модалка информации о групповом чате -->
    <div class="modal-overlay" id="modal-group-chat" style="display: none;" role="dialog" aria-modal="true">
        <div class="modal-content profile-modal" id="modal-group-chat-content">
            <button class="modal-content__close" id="btn-close-group-chat" aria-label="Закрыть">&times;</button>
            <div class="profile-modal__header">
                <div class="profile-modal__avatar" id="group-chat-avatar"></div>
                <div class="profile-modal__title">
                    <h2 id="group-chat-title"></h2>
                    <span class="profile-modal__email" id="group-chat-description"></span>
                </div>
            </div>
            <div class="group-chat-modal__members-header">
                <span id="group-chat-members-count"></span>
            </div>
            <div class="group-chat-modal__members-list" id="group-chat-members-list"></div>
        </div>
    </div>
    <!-- Контекстное меню сообщения -->
    <div class="context-menu" id="context-menu" style="display: none;">
        <button class="context-menu__item" id="ctx-reply">Ответить</button>
        <button class="context-menu__item" id="ctx-copy">Копировать текст</button>
        <div class="context-menu__delete-group" id="ctx-delete-group" style="display: none;">
            <button class="context-menu__item context-menu__item--danger" id="ctx-delete-toggle">Удалить</button>
            <div class="context-menu__delete-sub" id="ctx-delete-sub" style="display: none;">
                <button class="context-menu__item context-menu__item--danger" id="ctx-delete-for-me">Удалить у себя</button>
                <button class="context-menu__item context-menu__item--danger" id="ctx-delete-for-all">Удалить у всех</button>
            </div>
        </div>
    </div>
</body>
</html>
