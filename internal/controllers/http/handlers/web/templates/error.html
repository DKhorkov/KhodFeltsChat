<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KFC Chat — Ошибка</title>
    <link rel="stylesheet" href="/web/static/css/global.css">
    <link rel="stylesheet" href="/web/static/css/error.css">
</head>
<body>
    <div class="error-container">
        <div class="error-card">
            <div class="error-card__icon">❌</div>
            <div class="error-card__title">Ошибка</div>
            <div class="error-card__code">{{.Code}}</div>
            <div class="error-card__message">{{.Message}}</div>
            <a href="/web/login" class="error-card__btn">На страницу входа</a>
        </div>
    </div>
</body>
</html>
